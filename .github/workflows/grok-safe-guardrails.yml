name: Grok Safe Guardrails

on:
  push:
    branches:
      - 'privacy-hardening-**'
  pull_request:
    paths:
      - 'grok-safe/**'
      - 'crates/codegen/xai-file-utils/**'
      - 'crates/codegen/xai-grok-memory/**'
      - 'crates/codegen/xai-grok-shell/src/upload/**'
      - 'crates/codegen/xai-grok-shell/src/remote/**'
      - 'crates/codegen/xai-grok-shell/src/session/storage/**'
      - 'crates/codegen/xai-grok-shell/src/agent/init.rs'
      - 'crates/codegen/xai-grok-shell/src/agent/feedback_client.rs'
      - 'crates/codegen/xai-grok-shell/src/agent/session_registry_client.rs'
      - 'crates/codegen/xai-grok-shell/src/extensions/feedback.rs'
      - 'crates/codegen/xai-grok-update/**'
      - 'crates/codegen/xai-grok-telemetry/**'
      - 'crates/codegen/xai-grok-workspace/src/upload/**'
      - 'crates/codegen/xai-grok-workspace/src/recovery.rs'
      - 'crates/codegen/xai-grok-http/**'
      - 'crates/codegen/xai-grok-sampler/**'
      - 'crates/codegen/xai-mixpanel/**'
      - 'crates/common/xai-tracing/src/http_client.rs'
      - 'prod/mc/cli-chat-proxy-types/**'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/grok-safe-guardrails.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grok-safe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: Static fail-closed audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact safety commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse grok-safe PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem .\grok-safe\scripts\*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("PowerShell parse error in {0}: {1}" -f $_.Name, (($errors | ForEach-Object Message) -join '; '))
            }
          }
          if ($failed) { exit 1 }

      - name: Recount patch check - shared GCS dispatcher
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-file-utils/src/gcs.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - StorageClient
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-file-utils/src/storage_client.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - agent storage-mode bootstrap
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-shell/src/agent/init.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - feedback extension
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-shell/src/extensions/feedback.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - feedback session analytics client
        shell: pwsh
        run: git apply --recount --check -- grok-safe/patches/0002-block-feedback-session-signals.patch
      - name: Recount patch check - session registry replication
        shell: pwsh
        run: git apply --recount --check -- grok-safe/patches/0003-block-session-registry-replication.patch
      - name: Recount patch check - remote memory embeddings
        shell: pwsh
        run: git apply --recount --check -- grok-safe/patches/0004-block-remote-memory-embeddings.patch
      - name: Recount patch check - remote session client
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-shell/src/remote/client.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - product telemetry client
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-telemetry/src/client.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - external OTLP
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-telemetry/src/external/mod.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - internal OTLP
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-telemetry/src/otel_layer/mod.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch
      - name: Recount patch check - self updater
        shell: pwsh
        run: git apply --recount --check --include=crates/codegen/xai-grok-update/src/auto_update.rs -- grok-safe/patches/0001-disable-cloud-storage-uploads.patch

      - name: Recount ordered patch set applicability
        shell: pwsh
        run: |
          $patches = @(Get-ChildItem .\grok-safe\patches\*.patch | Sort-Object Name)
          if ($patches.Count -eq 0) { throw 'No grok-safe patches found' }
          foreach ($patch in $patches) {
            git apply --recount --check -- $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch context check failed: $($patch.Name)" }
          }

      - name: Run grok-safe static audit
        shell: pwsh
        run: .\grok-safe\scripts\audit.ps1

      - name: Audit workspace upload/recovery egress boundary
        shell: pwsh
        run: .\grok-safe\scripts\audit-egress-boundaries.ps1

  hardened-compile:
    name: Apply patch and compile hardened crates
    needs: static-audit
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact safety commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned Rust toolchain
        shell: pwsh
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Install pinned DotSlash action
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Verify DotSlash
        shell: pwsh
        run: dotslash --version

      - name: Apply ordered hardening patch set
        shell: pwsh
        run: |
          $patches = @(Get-ChildItem .\grok-safe\patches\*.patch | Sort-Object Name)
          if ($patches.Count -eq 0) { throw 'No grok-safe patches found' }
          foreach ($patch in $patches) {
            Write-Host "Applying $($patch.Name)"
            git apply --recount --check -- $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch context check failed: $($patch.Name)" }
            git apply --recount -- $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Patch apply failed: $($patch.Name)" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patched tree failed git diff --check' }

      - name: Compile xai-file-utils hardening
        shell: pwsh
        run: cargo check -p xai-file-utils --quiet

      - name: Compile xai-grok-memory hardening (diagnostic)
        continue-on-error: true
        shell: pwsh
        run: cargo check -p xai-grok-memory --quiet

      - name: Compile xai-grok-telemetry hardening (diagnostic)
        continue-on-error: true
        shell: pwsh
        run: cargo check -p xai-grok-telemetry --quiet

      - name: Compile xai-grok-shell hardening (diagnostic; final release is the production hard gate)
        continue-on-error: true
        shell: pwsh
        run: cargo check -p xai-grok-shell --quiet

      - name: Compile xai-grok-update hardening (diagnostic; final release is the production hard gate)
        continue-on-error: true
        shell: pwsh
        run: cargo check -p xai-grok-update --quiet

      - name: Link Windows hardened release
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'release-build.log'
          cargo build -p xai-grok-pager-bin --release --message-format short *> $log
          $code = $LASTEXITCODE
          Get-Content -LiteralPath $log -Tail 160
          exit $code

      - name: Smoke-test produced binary without starting a session
        shell: pwsh
        run: .\target\release\xai-grok-pager.exe version
